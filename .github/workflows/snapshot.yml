name: snapshot

# 生成工具链快照，可选发布为 release asset（供 build workflow / 项目仓库下载）。
#
# 需要在**有 CoreELEC 工具链的机器**上运行（自托管 runner，或 CoreELEC 构建容器）。
# 容器里跑的话挂载到 /home/docker/CoreELEC 最省事：
#   docker run --rm -v "$PWD:/home/docker/CoreELEC" -w /home/docker/CoreELEC <image> ...
#
# 说明：快照里含 libGLESv2 / libEGL / libamcodec 三个 Amlogic 供应商二进制（共约 68 MB），
# 其余全部是 gcc/binutils/glibc/GStreamer 等开源件；不含任何项目源码或用户配置。
# 只有你明确提供 release-tag 时才会发布；不填则只上传 artifact（仓库成员可下载）。

on:
  workflow_dispatch:
    inputs:
      toolchain-dir:
        description: CoreELEC 工具链根目录
        type: string
        default: /home/docker/CoreELEC/build.CoreELEC-Amlogic-ng.arm-21/toolchain
      runner:
        description: runner 标签（有 CoreELEC 工具链的机器，用逗号分隔可多标签）
        type: string
        default: self-hosted
      minimal:
        description: 精简裁剪（去掉 gold/dwp/lto-dump/lto1）
        type: boolean
        default: true
      lean:
        description: 进一步瘦身 sysroot（895M→540M，tar.zst 218M→139M）；会先跑产物一致性闸门
        type: boolean
        default: true
      verify:
        description: 出包后真编译两个项目做验证
        type: boolean
        default: true
      cleanroom-images:
        description: 干净容器验证用的镜像（空格分隔；需 runner 上有 docker）
        type: string
        default: ubuntu:24.04
      release-tag:
        description: 发布用的 tag（留空则只上传 artifact，不发布）
        type: string
        default: ''
      project-ref:
        description: 验证用项目 ref
        type: string
        default: ''

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 确保 zstd 可用
        shell: bash
        run: command -v zstd >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd; }

      - name: 生成快照
        shell: bash
        env:
          TOOLCHAIN_DIR_INPUT: ${{ inputs.toolchain-dir }}
          MINIMAL: ${{ inputs.minimal }}
          LEAN: ${{ inputs.lean }}
        run: |
          set -euo pipefail
          args=(--toolchain-dir "${TOOLCHAIN_DIR_INPUT}" --out snapshots)
          if [ "${MINIMAL}" != "true" ]; then args+=(--no-minimal); fi
          if [ "${LEAN}" = "true" ]; then args+=(--lean); fi
          scripts/make-snapshot.sh "${args[@]}"

      # 精简版必须能和全量版产出完全相同的二进制，否则就是删过头了。
      # 惯例抽样：两份快照都真编译一遍，逐字节比对 sha256（实测两边本来就完全一致）。
      - name: 生成对照快照（全量 sysroot）
        if: inputs.lean
        shell: bash
        env:
          TOOLCHAIN_DIR_INPUT: ${{ inputs.toolchain-dir }}
          MINIMAL: ${{ inputs.minimal }}
        run: |
          set -euo pipefail
          args=(--toolchain-dir "${TOOLCHAIN_DIR_INPUT}" --out snapshots-full)
          if [ "${MINIMAL}" != "true" ]; then args+=(--no-minimal); fi
          scripts/make-snapshot.sh "${args[@]}"

      - name: 取出两个项目源码（用于验证）
        if: inputs.verify
        uses: actions/checkout@v4
        with:
          repository: imagemlt/AMLgsMenu
          ref: ${{ inputs.project-ref }}
          path: projects/AMLgsMenu
          submodules: recursive

      - name: 取出 AMLDigitalFPV 源码（用于验证）
        if: inputs.verify
        uses: actions/checkout@v4
        with:
          repository: imagemlt/AMLDigitalFPV
          ref: ${{ inputs.project-ref }}
          path: projects/AMLDigitalFPV
          submodules: recursive

      - name: 用快照真编译两个项目
        if: inputs.verify
        shell: bash
        env:
          LEAN: ${{ inputs.lean }}
        run: |
          set -euo pipefail
          snapshot="$(ls snapshots/aml-toolchain-*.tar.zst | head -1)"
          scripts/verify-snapshot.sh --snapshot "${snapshot}" --projects-dir "${PWD}/projects" \
            --artifacts-dir "${PWD}/artifacts-lean"

          if [ "${LEAN}" != "true" ]; then
            echo "非精简版，没有可对比的对象，跳过一致性闸门"
            exit 0
          fi

          full_snapshot="$(ls snapshots-full/aml-toolchain-*.tar.zst | head -1)"
          scripts/verify-snapshot.sh --snapshot "${full_snapshot}" --projects-dir "${PWD}/projects" \
            --artifacts-dir "${PWD}/artifacts-full"

          echo "##### 产物 sha256 对比（全量 vs 精简）"
          cat artifacts-full/ALL.sha256
          cat artifacts-lean/ALL.sha256
          if diff -u artifacts-full/ALL.sha256 artifacts-lean/ALL.sha256; then
            echo "一致：精简没有改变编译产物"
          else
            echo "::error::精简版与全量版产出的二进制不一致。说明精简删掉了编译需要的东西：请检查 scripts/prune-lean.py 的删除清单，禁止发布这份快照。"
            exit 1
          fi

      # 这一步是"本地能编、换环境就挂"的体检：快照里的 as/ld 是 host 程序，
      # 会依赖构建机的系统库（libsframe.so.1 / libbfd-2.42-system.so 等）。
      # 之前在本地生成快照时没发现，换到 22.04 runner 上就直接挂了，所以固定成一道关。
      - name: 干净容器验证（该快照能在哪个镜像上跑）
        shell: bash
        env:
          IMAGES: ${{ inputs.cleanroom-images }}
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "::warning::runner 上没有 docker，跳过干净容器验证。这一步专门用来发现 host 侧库缺失，建议在有 docker 的 runner 上跑。"
            exit 0
          fi
          snapshot="$(ls snapshots/aml-toolchain-*.tar.zst | head -1)"
          work="$(mktemp -d)"
          zstd -d -c "${snapshot}" | tar -xf - -C "${work}"
          # shellcheck disable=SC2086
          tests/cleanroom-toolchain-test.sh "${work}" ${IMAGES}
          rm -rf "${work}"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aml-toolchain-snapshot
          path: |
            snapshots/*.tar.zst
            snapshots/SHA256SUMS
            snapshots/snapshot-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 release
        if: inputs.release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" snapshots/*.tar.zst snapshots/SHA256SUMS snapshots/snapshot-info.txt --clobber
          else
            gh release create "${TAG}" \
              --title "toolchain ${TAG}" \
              --notes "CoreELEC 交叉工具链快照（$(cat snapshots/snapshot-info.txt | tr '\n' ' ')）" \
              snapshots/*.tar.zst snapshots/SHA256SUMS snapshots/snapshot-info.txt
          fi
